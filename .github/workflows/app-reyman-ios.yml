# App Reyman (app de taller) · compila la app de iPhone/iPad en un Mac de GitHub y la sube a TestFlight.
# La app abre app.talleresreyman.es por dentro: los cambios de la App Reyman NO necesitan nueva compilación;
# solo hay que compilar si cambia apps/reyman-nativo (permisos, plugins, icono…). Mismos secretos que Reyman Diag.
# Mientras no esté la cuenta de desarrollador de Apple solo comprueba que compila (sin firmar).
# Cuando estén los secretos de App Store Connect, además firma y la sube a TestFlight.
#   Secretos (Settings → Secrets and variables → Actions):
#     ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contenido del archivo .p8), APPLE_TEAM_ID
name: App Reyman · iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/reyman-nativo/**', '.github/workflows/app-reyman-ios.yml']
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        working-directory: apps/reyman-nativo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xcode más reciente
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Dependencias y web de la app
        run: |
          npm install --no-audit --no-fund
      - name: Proyecto iOS
        run: |
          npx cap add ios
          node scripts/preparar-nativo.mjs ios
          npx cap sync ios
      - name: Compilar sin firmar (comprobación)
        if: env.ASC_KEY_ID == ''
        working-directory: apps/reyman-nativo/ios/App
        shell: bash
        run: |
          set -eo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40
          echo "Compila bien. Falta la cuenta de desarrollador de Apple para firmar y subir a TestFlight."
      - name: Identificador de la app en la cuenta de Apple
        if: env.ASC_KEY_ID != ''
        run: node scripts/registrar-bundle.mjs
      - name: Firmar y subir a TestFlight
        if: env.ASC_KEY_ID != ''
        working-directory: apps/reyman-nativo/ios/App
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          V=$(node -p "require('../../package.json').version")
          # El archivo se compila sin firmar; al exportarlo para App Store Connect, Apple lo firma
          # con el certificado de distribución (firma en la nube), que no necesita dispositivos registrados
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=$V CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -40
          # Notificaciones: el archivo se compila sin firmar y entonces no guarda sus permisos (entitlements).
          # Apple firma al exportar con los del archivo «archived-expanded-entitlements.xcent»: se pone a mano
          # el de App/App.entitlements (aps-environment) para que la firma lleve el permiso de notificaciones.
          APPX=$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app
          if ! grep -qs aps-environment "$APPX/archived-expanded-entitlements.xcent"; then cp App/App.entitlements "$APPX/archived-expanded-entitlements.xcent"; echo "Permisos añadidos al archivo"; fi
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          # Comprobación: exportar sin subir y mirar los permisos con los que firma Apple
          sed 's#<string>upload</string>#<string>export</string>#' $RUNNER_TEMP/export.plist > $RUNNER_TEMP/export-local.plist
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export-local.plist -exportPath $RUNNER_TEMP/local \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID | tail -5
          (cd $RUNNER_TEMP/local && unzip -oq *.ipa && codesign -d --entitlements - Payload/App.app 2>/dev/null | grep -A1 aps-environment) \
            && echo "Firmada con permiso de notificaciones" || echo "::warning::La app firmada no lleva aps-environment: las notificaciones no funcionarán"
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID | tail -40
          echo "Subida a TestFlight: versión $V (compilación ${{ github.run_number }})"
