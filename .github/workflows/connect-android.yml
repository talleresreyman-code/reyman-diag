# Reyman Connect · compila la app de Android (APK de pruebas) en GitHub, sin Android Studio.
# Se lanza sola al cambiar la app o el núcleo OBD, o a mano desde la pestaña Actions.
name: Reyman Connect · Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/cliente/**', 'packages/obd-core/**', '.github/workflows/connect-android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/cliente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dependencias
        run: npm ci
      - name: Compilar la web de la app
        run: node scripts/build.js
      - name: Proyecto Android
        run: |
          npx cap add android
          node scripts/preparar-nativo.mjs android
          npx cap sync android
      - name: APK
        working-directory: apps/cliente/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Nombre con la versión
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "Reyman_Connect_v${V}.apk"
          echo "VERSION=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Reyman_Connect_v${{ env.VERSION }}_android
          path: apps/cliente/Reyman_Connect_v*.apk
          retention-days: 30
      # Copia también en la rama «apk» (un solo commit) para poder llevarlo a Drive sin entrar en GitHub
      - name: Guardar en la rama apk
        run: |
          mkdir -p /tmp/apk && cp Reyman_Connect_v*.apk /tmp/apk/
          cd /tmp/apk
          git init -q -b apk
          git config user.name "Reyman Connect CI"
          git config user.email "ci@talleresreyman.es"
          git add . && git commit -qm "Reyman Connect v${VERSION} (Android, ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
