<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d57a5">
<title>Reyman Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"><main><p style="padding:24px">Cargando Reyman Connect…</p></main></div>
<noscript>Reyman Connect necesita JavaScript.</noscript>
<script>
// Si algo falla al arrancar, se enseña en pantalla (en la app no hay consola a mano)
(function () {
  function ver(t) {
    var a = document.getElementById('app');
    if (!a || window.__reymanArrancada) return;
    a.innerHTML = '<main style="padding:24px;font-family:system-ui"><h2>Reyman Connect no ha podido arrancar</h2><p>Haz una captura y envíasela al taller:</p><pre style="white-space:pre-wrap;background:#fff;padding:12px;border-radius:8px;font-size:13px">' + String(t).replace(/[<&]/g, function (c) { return c === '<' ? '&lt;' : '&amp;'; }) + '</pre></main>';
  }
  window.addEventListener('error', function (e) { ver((e.message || 'Error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '') + (e.error && e.error.stack ? '\n' + e.error.stack : '')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason || {}; ver('Promesa rechazada: ' + (r.message || r) + (r.stack ? '\n' + r.stack : '')); });
  setTimeout(function () { ver('Tiempo de espera agotado (15 s) sin terminar de cargar.\nCapacitor: ' + (window.Capacitor ? window.Capacitor.getPlatform && window.Capacitor.getPlatform() : 'no') + '\n' + navigator.userAgent); }, 15000);
})();
</script>
<script src="app.js"></script>
</body>
</html>
