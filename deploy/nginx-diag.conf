# Proxy del VPS para diag.talleresreyman.es (ajustar al proxy que ya publica app.talleresreyman.es)
server {
  listen 443 ssl http2;
  server_name diag.talleresreyman.es;
  # ssl_certificate / ssl_certificate_key: los mismos de certbot que el resto de subdominios
  client_max_body_size 12m;
  location / {
    proxy_pass http://127.0.0.1:3020;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
